
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>EXLAND</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>EXLAND</h1>
    <span class="online-status">● MULTIPLAYER</span>
  </header>

  <main>
    <section id="creator" class="panel">
      <h2>Karakterini oluştur</h2>

      <label for="gender">Karakter tipi</label>
      <select id="gender">
        <option value="male">Erkek</option>
        <option value="female">Kadın</option>
      </select>

      <div class="tabs">
        <button class="tab active" data-tab="outfitPane">Kıyafet</button>
        <button class="tab" data-tab="pantsPane">Pantolon</button>
        <button class="tab" data-tab="headwearPane">Şapka</button>
        <button class="tab" data-tab="accessoryPane">Aksesuar</button>
      </div>

      <section id="outfitPane" class="pane active">
        <h3>Kıyafet seç</h3>
        <div id="outfits" class="items"></div>
      </section>

      <section id="pantsPane" class="pane">
        <h3>Pantolon seç</h3>
        <div id="pants" class="items"></div>
      </section>

      <section id="headwearPane" class="pane">
        <h3>Şapka seç</h3>
        <div id="headwear" class="items"></div>
      </section>

      <section id="accessoryPane" class="pane">
        <h3>Aksesuar seç</h3>
        <div id="accessories" class="items"></div>
      </section>

      <label for="hair">Saç</label>
      <select id="hair"></select>

      <label for="beard">Sakal</label>
      <select id="beard"></select>

      <div class="actions">
        <button id="random">🎲 Rastgele</button>
        <button id="save">DEVAM ET</button>
      </div>
    </section>

    <section id="lobby" class="panel" hidden>
      <h2>EXLAND Lobi</h2>

      <label for="playerName">Oyuncu adı</label>
      <input
        id="playerName"
        type="text"
        minlength="3"
        maxlength="16"
        placeholder="Oyuncu adın"
        autocomplete="off"
      >

      <button id="connect">SUNUCUYA BAĞLAN</button>
      <p id="connection">Henüz bağlanmadın.</p>
    </section>

    <section id="gamePanel" class="panel">
      <h2>Oyun alanı</h2>

      <div id="gameScene">
        EXLAND OYUN ALANI
      </div>

      <div class="game-controls">
        <button id="fire">🔥 ATEŞ</button>
        <button id="reload">ŞARJÖR ↻</button>
        <button id="crouch">ÇÖMEL</button>
        <button id="door">🚪 KAPI</button>
      </div>

      <div class="voice-controls">
        <button id="mic">🎙 MİKROFON KAPALI</button>
        <button id="speaker">🔊 SES AÇIK</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>

</body>
</html>
